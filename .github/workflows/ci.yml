name: CI / Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-zig-tests:
    name: Zig Format Lint & Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Zig Code Formatting Check (Linter)
        run: make lint

      - name: Run Zig Native Unit Tests
        run: make check

      - name: Build Static Library & Benchmarks (ReleaseFast)
        run: make bench

      - name: Benchmark Regression Guard Check
        run: make bench-compare

  rust-ffi-tests-macos:
    name: macOS Rust FFI (awp-zig-rs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust FFI Tests (awp-zig-rs)
        run: make check-rust

      - name: Run Rust FFI Benchmark (1M Messages)
        run: make bench-rust

  rust-ffi-tests-linux:
    name: Linux Rust FFI (awp-zig-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust FFI Tests (awp-zig-rs)
        run: make check-rust
